global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: falcon
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/falcon_token
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.yml
        refresh_interval: 30s
