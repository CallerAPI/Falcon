version: 2

project_name: falcon

before:
  hooks:
    - go mod tidy

builds:
  - id: falcon
    main: ./cmd/falcon
    binary: falcon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - SECURITY.md
      - CHANGELOG.md
      - LICENSE
      - .env.example
      - adapters/**

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
    artifacts: checksum

dockers:
  - id: linux-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/callerapi/falcon:{{ .Version }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title=falcon
      - --label=org.opencontainers.image.source=https://github.com/CallerAPI/falcon
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0
  - id: linux-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/callerapi/falcon:{{ .Version }}-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title=falcon
      - --label=org.opencontainers.image.source=https://github.com/CallerAPI/falcon
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0

docker_manifests:
  - name_template: "ghcr.io/callerapi/falcon:{{ .Version }}"
    image_templates:
      - "ghcr.io/callerapi/falcon:{{ .Version }}-amd64"
      - "ghcr.io/callerapi/falcon:{{ .Version }}-arm64"
  - name_template: "ghcr.io/callerapi/falcon:latest"
    image_templates:
      - "ghcr.io/callerapi/falcon:{{ .Version }}-amd64"
      - "ghcr.io/callerapi/falcon:{{ .Version }}-arm64"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: [sign, --yes, "${artifact}"]

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  footer: |
    Verify a download:

        cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
          --certificate-identity-regexp 'https://github.com/CallerAPI/falcon/' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
        sha256sum -c checksums.txt --ignore-missing

    Verify the image:

        cosign verify ghcr.io/callerapi/falcon:{{ .Version }} \
          --certificate-identity-regexp 'https://github.com/CallerAPI/falcon/' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
