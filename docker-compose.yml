services:
  falcon:
    build:
      context: .
      args:
        VERSION: ${FALCON_VERSION:?set FALCON_VERSION to the release. make -s version prints the latest one}
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      FALCON_LISTEN: 0.0.0.0:8090
      FALCON_DB_PATH: /data/falcon.db
    volumes:
      - falcon-data:/data

volumes:
  falcon-data:
