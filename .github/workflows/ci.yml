name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Short fuzz passes on the three parsers of hostile input. A crash here
      # is a crash in production.
      - run: go test -run '^$' -fuzz=FuzzParse -fuzztime=20s ./internal/sipmsg/
      - run: go test -run '^$' -fuzz=FuzzRedact -fuzztime=20s ./internal/share/
      - run: go test -run '^$' -fuzz=FuzzCompute -fuzztime=20s ./internal/fingerprint/

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 curl python3
      # SIP redirect listener, Asterisk AGI, FreeSWITCH Lua (real mod_curl
      # argument rules), and the ConnexCS ScriptForge app against a live
      # Falcon with a token.
      - run: bash adapters/e2e/run.sh

  kamailio:
    # Real Kamailio in a container, sync and async routes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl python3
      - run: KAMAILIO_IMAGE=kamailio/kamailio-ci:5.5.2 bash adapters/e2e/run.sh

  opensips:
    # Real OpenSIPS in a container, sync and async routes. The image installs
    # rest_client and json from apt.opensips.org at start, so this job
    # depends on that mirror.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl python3
      - run: OPENSIPS_IMAGE=opensips/opensips:3.6 bash adapters/e2e/run.sh

  asterisk:
    # Real Asterisk (Alpine package) running the AGI against a live Falcon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl python3
      - run: ASTERISK_E2E=1 bash adapters/e2e/run.sh

  freeswitch:
    # Real FreeSWITCH with mod_curl and mod_lua running falcon.lua.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl python3
      - run: FREESWITCH_IMAGE=safarov/freeswitch:latest bash adapters/e2e/run.sh
