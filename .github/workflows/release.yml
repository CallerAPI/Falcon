name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
      # A push to main cuts the next patch tag, then this same job publishes
      # it. The tag push uses the workflow token, which does not start a
      # second run. A failed publish deletes the tag so the next push retries.
      # A failed verification keeps the tag.
      - name: Tag the next patch
        id: ver
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is already a release"
            exit 0
          fi
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          ver="${latest#v}"
          major="${ver%%.*}"
          rest="${ver#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          new="v${major}.${minor}.$((patch + 1))"
          git config user.name "CallerAPI"
          git config user.email "release@callerapi.com"
          git tag -a "$new" -m "Release $new"
          git push origin "$new"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "Tagged $new"
      - uses: docker/setup-qemu-action@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      - uses: docker/login-action@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      - uses: anchore/sbom-action/download-syft@v0
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      # Binaries for linux and darwin on amd64 and arm64, checksums, an SBOM
      # per archive, keyless cosign signatures, and multi-arch images on
      # GHCR. See .goreleaser.yaml.
      - uses: goreleaser/goreleaser-action@v6
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs the verify commands from the release notes. Keep the identity
      # the same as the footer in .goreleaser.yaml.
      - name: Verify the published signatures
        id: verify
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
        env:
          IDENTITY: https://github.com/CallerAPI/Falcon/.github/workflows/release.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          version=$(jq -r .version dist/metadata.json)
          digest=$(jq -r --arg name "ghcr.io/callerapi/falcon:${version}" \
            '.[] | select(.type == "Docker Manifest" and .name == $name) | .extra.Digest' \
            dist/artifacts.json)
          case "$digest" in
            sha256:*) ;;
            *) echo "no digest for ghcr.io/callerapi/falcon:${version} in dist/artifacts.json"; exit 1 ;;
          esac
          cd dist
          cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" checksums.txt
          sha256sum -c checksums.txt --ignore-missing
          cosign verify "ghcr.io/callerapi/falcon@${digest}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
      # The release and :latest are already public at this point. Someone
      # must repoint :latest by hand.
      - name: Open an issue if verification failed
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "release ${TAG}: signature verification failed, check :latest" \
            --body "The verify step failed for ${TAG}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Repoint ghcr.io/callerapi/falcon:latest to the last verified release."
      # A failed verification must never delete, move, or repoint a tag or a
      # release. The only actions are the issue above and the failed job.
      # This step runs only when the job failed before the verify step ran.
      - name: Drop the tag if the publish failed
        if: failure() && steps.ver.outputs.tag != '' && steps.verify.outcome == 'skipped'
        run: git push origin ":refs/tags/${{ steps.ver.outputs.tag }}"
