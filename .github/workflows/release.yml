name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      # A push to main cuts the next patch tag, then this same job publishes
      # it. The tag push uses the workflow token, which does not start a
      # second run. A failed publish deletes the tag so the next push retries.
      - name: Tag the next patch
        id: ver
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is already a release"
            exit 0
          fi
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          ver="${latest#v}"
          major="${ver%%.*}"
          rest="${ver#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          new="v${major}.${minor}.$((patch + 1))"
          git config user.name "CallerAPI"
          git config user.email "release@callerapi.com"
          git tag -a "$new" -m "Release $new"
          git push origin "$new"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "Tagged $new"
      - uses: docker/setup-qemu-action@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      - uses: docker/login-action@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      - uses: anchore/sbom-action/download-syft@v0
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
      # Binaries for linux and darwin on amd64 and arm64, checksums, an SBOM
      # per archive, keyless cosign signatures, and multi-arch images on
      # GHCR. See .goreleaser.yaml.
      - uses: goreleaser/goreleaser-action@v6
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.skip == 'false'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Drop the tag if the publish failed
        if: failure() && steps.ver.outputs.tag != ''
        run: git push origin ":refs/tags/${{ steps.ver.outputs.tag }}"
