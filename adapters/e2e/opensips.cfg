# Minimal OpenSIPS 3.x for the adapter test. Every INVITE is screened by
# Falcon on the host. Rejects get the code Falcon asked for; anything else
# gets 404 so the test can tell "allowed" from "no answer".

log_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=1
socket=udp:0.0.0.0:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "cfgutils.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "sipmsgops.so"
loadmodule "rest_client.so"
loadmodule "json.so"

# The e2e Falcon runs with this token. The adapter must send it.
modparam("cfgutils", "shvset", "falcon_url=s:http://127.0.0.1:8090/v1/screen")
modparam("cfgutils", "shvset", "falcon_token=s:e2e-token")

include_file "/etc/opensips/falcon.cfg"

route {
    if (is_method("INVITE")) {
        route(falcon_screen);
        sl_send_reply(404, "Allowed by Falcon");
        exit;
    }
    sl_send_reply(405, "Method Not Allowed");
    exit;
}
