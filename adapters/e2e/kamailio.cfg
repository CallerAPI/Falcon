#!KAMAILIO
# Minimal Kamailio for the adapter test. Every INVITE is screened by
# Falcon on the host. Rejects get the code Falcon asked for; anything else
# gets 404 so the test can tell "allowed" from "no answer".

debug=2
log_stderror=yes
fork=no
children=1
listen=udp:0.0.0.0:5060

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "http_client.so"
loadmodule "jansson.so"

# The e2e Falcon runs with this token. The adapter must send it.
#!define FALCON_URL "http://127.0.0.1:8090/v1/screen"
#!define FALCON_TOKEN "e2e-token"

import_file "falcon.cfg"

request_route {
    if (is_method("INVITE")) {
        route(FALCON_SCREEN);
        sl_send_reply("404", "Allowed by Falcon");
        exit;
    }
    sl_send_reply("405", "Method Not Allowed");
    exit;
}
