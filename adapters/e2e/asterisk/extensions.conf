; The adapter's contexts, plus what the test needs after the screen: a
; reject hangs up with cause 21 (403 on the wire), an allowed call lands in
; falcon-allowed-inbound and hangs up with cause 22 (410 on the wire). No
; other context answers 410, so a 410 proves where the call went.
#include falcon-extensions.conf

[falcon-allowed-inbound]
exten => _[+0-9]X.,1,NoOp(Allowed by Falcon)
 same => n,Hangup(22)

[outbound-trunk]
exten => _[+0-9]X.,1,Hangup(1)
