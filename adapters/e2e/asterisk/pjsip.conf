; Minimal PJSIP for the adapter test. Any peer may send an INVITE; it lands
; in the from-trunk-falcon context from adapters/asterisk/extensions.conf.
[global]
type=global
endpoint_identifier_order=ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[anonymous]
type=endpoint
context=from-trunk-falcon
disallow=all
allow=ulaw
allow=alaw
direct_media=no
