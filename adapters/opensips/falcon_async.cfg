# Falcon screen on INVITE for OpenSIPS 3.x, asynchronous. For a busy proxy.
#
# The synchronous falcon.cfg holds a worker for up to 2 s while Falcon
# answers. A Falcon that accepts connections and hangs would stall every
# worker. This file suspends the transaction with async() and resumes it
# when the answer arrives, so workers keep serving other calls.
#
# Load cfgutils.so, sl.so, tm.so, sipmsgops.so, rest_client.so, and json.so
# first, then include this file. Do not include falcon.cfg as well.
#
# Your main route must:
#   1. call route(falcon_screen); for INVITE. Script execution stops there.
#   2. define route[falcon_continue] with what you did after the screen.
#      It runs inside the resumed transaction, so reply with t_reply()
#      and relay with t_relay().
#
# Set both values before the include_file line:
#   modparam("cfgutils", "shvset", "falcon_url=s:http://127.0.0.1:8090/v1/screen")
#   modparam("cfgutils", "shvset", "falcon_token=s:replace-me")

modparam("rest_client", "connection_timeout", 2)
modparam("rest_client", "curl_timeout", 2)

route[falcon_screen] {
    if (!is_method("INVITE")) {
        return(1);
    }

    $json(falcon_req) := "{}";
    $json(falcon_req/switch) = "opensips";
    $json(falcon_req/method) = "INVITE";
    $json(falcon_req/request_uri) = $ru;
    $json(falcon_req/source_ip) = $si;
    $json(falcon_req/headers) := "{}";
    $json(falcon_req/headers/From) = $hdr(From);
    $json(falcon_req/headers/To) = $hdr(To);
    $json(falcon_req/headers/Call-ID) = $ci;
    if ($ua != NULL) {
        $json(falcon_req/headers/User-Agent) = $ua;
    }
    if ($hdr(P-Asserted-Identity) != NULL) {
        $json(falcon_req/headers/P-Asserted-Identity) = $hdr(P-Asserted-Identity);
    }
    if ($hdr(Identity) != NULL) {
        $json(falcon_req/headers/Identity) = $hdr(Identity);
    }
    if ($hdr(Contact) != NULL) {
        $json(falcon_req/headers/Contact) = $hdr(Contact);
    }
    if ($hdr(Via) != NULL) {
        $json(falcon_req/headers/Via) = $hdr(Via);
    }
    if ($hdr(Max-Forwards) != NULL) {
        $json(falcon_req/headers/Max-Forwards) = $hdr(Max-Forwards);
    }

    $var(falcon_body) = $json_compact(falcon_req);
    $var(falcon_hdr) = "X-Falcon-Token: " + $shv(falcon_token);
    rest_append_hf($var(falcon_hdr));
    async(rest_post($shv(falcon_url), $var(falcon_body), "application/json", $var(falcon_res), $var(falcon_ct), $var(falcon_code)), falcon_resume);
}

route[falcon_resume] {
    if ($rc < 0 || $var(falcon_code) != 200) {
        xlog("L_WARN", "Falcon unreachable or refused (rc=$rc http=$var(falcon_code)), fail-open for $ci\n");
        route(falcon_continue);
        exit;
    }

    $json(falcon_res) := $var(falcon_res);
    if ($json(falcon_res/action) == NULL) {
        route(falcon_continue);
        exit;
    }

    append_hf("X-Falcon-Action: $json(falcon_res/action)\r\n");
    append_hf("X-Falcon-Score: $json(falcon_res/risk_score)\r\n");

    if ($json(falcon_res/action) == "reject" || $json(falcon_res/action) == "challenge") {
        $var(falcon_status) = 603;
        if ($json(falcon_res/action) == "reject" && $json(falcon_res/sip_status) != NULL && $json(falcon_res/sip_status) >= 300) {
            $var(falcon_status) = $json(falcon_res/sip_status);
        }
        t_reply($var(falcon_status), "Falcon");
        exit;
    }
    route(falcon_continue);
    exit;
}
