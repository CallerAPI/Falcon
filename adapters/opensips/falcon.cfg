# Falcon screen on INVITE for OpenSIPS 3.x. Load cfgutils.so, sl.so,
# sipmsgops.so, rest_client.so, and json.so first, then include this file.
# Do not load those modules again here. The route posts selected headers
# and applies X-Falcon-* plus a 603 on reject. Falcon unreachable means
# the call continues.
#
# Set both values before the include_file line. FALCON_TOKEN must match
# the FALCON_TOKEN of the Falcon process.
#
#   modparam("cfgutils", "shvset", "falcon_url=s:http://127.0.0.1:8090/v1/screen")
#   modparam("cfgutils", "shvset", "falcon_token=s:replace-me")

# Fail-open is the Falcon default. Keep both timeouts low.
modparam("rest_client", "connection_timeout", 2)
modparam("rest_client", "curl_timeout", 2)

route[falcon_screen] {
    if (!is_method("INVITE")) {
        return(1);
    }

    $json(falcon_req) := "{}";
    $json(falcon_req/switch) = "opensips";
    $json(falcon_req/method) = "INVITE";
    $json(falcon_req/request_uri) = $ru;
    $json(falcon_req/source_ip) = $si;
    $json(falcon_req/headers) := "{}";
    $json(falcon_req/headers/From) = $hdr(From);
    $json(falcon_req/headers/To) = $hdr(To);
    $json(falcon_req/headers/Call-ID) = $ci;
    if ($ua != NULL) {
        $json(falcon_req/headers/User-Agent) = $ua;
    }
    if ($hdr(P-Asserted-Identity) != NULL) {
        $json(falcon_req/headers/P-Asserted-Identity) = $hdr(P-Asserted-Identity);
    }
    if ($hdr(Identity) != NULL) {
        $json(falcon_req/headers/Identity) = $hdr(Identity);
    }
    if ($hdr(Contact) != NULL) {
        $json(falcon_req/headers/Contact) = $hdr(Contact);
    }
    if ($hdr(Via) != NULL) {
        $json(falcon_req/headers/Via) = $hdr(Via);
    }
    if ($hdr(Max-Forwards) != NULL) {
        $json(falcon_req/headers/Max-Forwards) = $hdr(Max-Forwards);
    }

    # Outbound calls from your own customers: set these before the route
    # so Falcon checks the caller id against the account's numbers.
    #   $json(falcon_req/direction) = "outbound";
    #   $json(falcon_req/customer) = $au;

    $var(falcon_body) = $json_compact(falcon_req);
    $var(falcon_hdr) = "X-Falcon-Token: " + $shv(falcon_token);
    rest_append_hf($var(falcon_hdr));
    $var(falcon_rc) = rest_post($shv(falcon_url), $var(falcon_body), "application/json", $var(falcon_res), $var(falcon_ct), $var(falcon_code));
    if ($var(falcon_rc) < 0 || $var(falcon_code) != 200) {
        xlog("L_WARN", "Falcon unreachable or refused (rc=$var(falcon_rc) http=$var(falcon_code)), fail-open for $ci\n");
        return(1);
    }

    $json(falcon_res) := $var(falcon_res);
    if ($json(falcon_res/action) == NULL) {
        return(1);
    }

    append_hf("X-Falcon-Action: $json(falcon_res/action)\r\n");
    append_hf("X-Falcon-Score: $json(falcon_res/risk_score)\r\n");

    if ($json(falcon_res/action) == "reject" || $json(falcon_res/action) == "challenge") {
        $var(falcon_status) = 603;
        if ($json(falcon_res/action) == "reject" && $json(falcon_res/sip_status) != NULL && $json(falcon_res/sip_status) >= 300) {
            $var(falcon_status) = $json(falcon_res/sip_status);
        }
        sl_send_reply($var(falcon_status), "Falcon");
        exit;
    }
    return(1);
}

# Optional: report how the call ended, so Falcon can score answer rate and
# talk time per caller and per customer. From your accounting or CDR hook,
# post {"call_id":"<Call-ID>","answered":true,"duration_s":42} to the
# /v1/outcome URL with the same X-Falcon-Token header through rest_post().
