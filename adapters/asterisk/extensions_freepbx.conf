; Falcon on FreePBX, Issabel, VitalPBX, and PBX in a Flash. Append this file
; to /etc/asterisk/extensions_custom.conf. Then set the trunk's inbound
; context to from-trunk-falcon and apply the config. To back out, set the
; context to from-pstn again.
;
; An allowed call continues to from-pstn, so inbound routes, time
; conditions, and caller id lookups work as before. Never continue to
; from-internal. An outside caller sent there gets internal dialing rights
; and can place toll calls.

[from-trunk-falcon]
exten => _[+0-9]X.,1,NoOp(Falcon screen ${EXTEN})
 ; falcon.agi reads FALCON_URL and FALCON_TOKEN from the environment. On
 ; FreePBX, where setting the Asterisk environment is awkward, you may
 ; instead uncomment these two lines and paste the same token Falcon runs
 ; with (generate it with openssl rand -hex 32). A channel variable wins
 ; over the environment.
 ; same => n,Set(FALCON_URL=http://127.0.0.1:8090/v1/screen)
 ; same => n,Set(FALCON_TOKEN=PASTE_YOUR_FALCON_TOKEN)
 same => n,Set(CHANNEL(hangup_handler_push)=falcon-hangup,s,1)
 same => n,AGI(falcon.agi)
 same => n,GotoIf($["${FALCON_ACTION}"="reject"]?drop)
 same => n,GotoIf($["${FALCON_ACTION}"="challenge"]?drop)
 same => n,GotoIf($["${FALCON_SAMPLE}"="1"]?rec:go)
 same => n(rec),Set(FALCON_RECORD_PATH=/tmp/falcon/${UNIQUEID}.wav)
 same => n,System(mkdir -p /tmp/falcon)
 same => n,MixMonitor(${FALCON_RECORD_PATH},S(${FALCON_SAMPLE_SECONDS}))
 same => n(go),Goto(from-pstn,${EXTEN},1)
 same => n(drop),Hangup(${IF($[${FALCON_HANGUP_CAUSE}>0]?${FALCON_HANGUP_CAUSE}:21)})
; Trunks that deliver to s instead of the DID pass through unscreened.
exten => s,1,Goto(from-pstn,s,1)

; Reports how the call ended. FreePBX moves the call through other
; contexts, so an h extension here would never run. A hangup handler does.
[falcon-hangup]
exten => s,1,AGI(falcon_hangup.agi)
 same => n,Return()
