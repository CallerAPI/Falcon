; Falcon on the inbound trunk. Copy falcon.agi and falcon_hangup.agi to
; /var/lib/asterisk/agi-bin/ and make them executable. The AGI talks to
; Falcon on 127.0.0.1:8090. FreePBX and other GUI distributions: use
; extensions_freepbx.conf instead.
;
; WARNING: an allowed call continues to falcon-allowed-inbound. You must
; define that context, or change the Goto to your own inbound context: the
; context that routes DIDs to users, queues, and IVRs. Never use
; from-internal, or any context that can dial out. An outside caller sent
; there gets internal dialing rights and can place toll calls.

[from-trunk-falcon]
exten => _[+0-9]X.,1,NoOp(Falcon screen ${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=falcon-hangup,s,1)
 same => n,AGI(falcon.agi)
 same => n,GotoIf($["${FALCON_ACTION}"="reject"]?drop)
 same => n,GotoIf($["${FALCON_ACTION}"="challenge"]?drop)
 same => n,Set(PJSIP_HEADER(add,X-Falcon-Action)=${FALCON_ACTION})
 same => n,Set(PJSIP_HEADER(add,X-Falcon-Score)=${FALCON_SCORE})
 ; Falcon asked for the first seconds of audio: record both legs to one
 ; stereo file. The hangup handler uploads it and reports the outcome.
 same => n,GotoIf($["${FALCON_SAMPLE}"="1"]?rec:go)
 same => n(rec),Set(FALCON_RECORD_PATH=/tmp/falcon/${UNIQUEID}.wav)
 same => n,System(mkdir -p /tmp/falcon)
 same => n,MixMonitor(${FALCON_RECORD_PATH},S(${FALCON_SAMPLE_SECONDS}))
 same => n(go),Goto(falcon-allowed-inbound,${EXTEN},1)
 same => n(drop),Hangup(${IF($[${FALCON_HANGUP_CAUSE}>0]?${FALCON_HANGUP_CAUSE}:21)})

; Outbound: your own customers calling out. Set FALCON_DIRECTION and
; FALCON_CUSTOMER before the AGI so Falcon checks the caller id against
; the numbers registered for that account.
[from-customer-falcon]
exten => _[+0-9]X.,1,NoOp(Falcon outbound screen ${EXTEN} for ${FALCON_CUSTOMER})
 same => n,Set(FALCON_DIRECTION=outbound)
 same => n,Set(CHANNEL(hangup_handler_push)=falcon-hangup,s,1)
 same => n,AGI(falcon.agi)
 same => n,GotoIf($["${FALCON_ACTION}"="reject"]?drop)
 same => n,GotoIf($["${FALCON_SAMPLE}"="1"]?rec:go)
 same => n(rec),Set(FALCON_RECORD_PATH=/tmp/falcon/${UNIQUEID}.wav)
 same => n,System(mkdir -p /tmp/falcon)
 same => n,MixMonitor(${FALCON_RECORD_PATH},S(${FALCON_SAMPLE_SECONDS}))
 same => n(go),Goto(outbound-trunk,${EXTEN},1)
 same => n(drop),Hangup(21)

; Reports how the call ended. A hangup handler runs in every context the
; call reaches, where an h extension runs only in the context the call
; ends in.
[falcon-hangup]
exten => s,1,AGI(falcon_hangup.agi)
 same => n,Return()

; ARI path. Requires falcon_ari.py and an ARI user. The same warning
; applies: the first Stasis argument is the context for allowed calls.
[from-trunk-falcon-ari]
exten => _[+0-9]X.,1,NoOp(Falcon ARI ${EXTEN})
 same => n,Stasis(falcon,falcon-allowed-inbound,${EXTEN},1)
 same => n,Hangup()
