# Falcon screen on INVITE. Load http_client.so and jansson.so first,
# then import this file. Do not load those modules again here.
# The script posts selected headers and applies X-Falcon-* plus a 603 on reject.
#
# Set the two defines before the import_file line, or edit them here.
# FALCON_TOKEN must match the FALCON_TOKEN of the Falcon process.

#!ifndef FALCON_URL
#!define FALCON_URL "http://127.0.0.1:8090/v1/screen"
#!endif
#!ifndef FALCON_TOKEN
#!define FALCON_TOKEN ""
#!endif

# Fail-open is the Falcon default. Keep the timeout low.
modparam("http_client", "connection_timeout", 2)
# Return the whole body, not the first line.
modparam("http_client", "query_result", 0)

route[FALCON_SCREEN] {
    if (!is_method("INVITE")) {
        return;
    }

    $var(body) = "{}";
    jansson_set("string", "switch", "kamailio", "$var(body)");
    jansson_set("string", "method", "INVITE", "$var(body)");
    jansson_set("string", "request_uri", "$ru", "$var(body)");
    jansson_set("string", "source_ip", "$si", "$var(body)");
    jansson_set("object", "headers", "{}", "$var(body)");
    jansson_set("string", "headers.From", "$hdr(From)", "$var(body)");
    jansson_set("string", "headers.To", "$hdr(To)", "$var(body)");
    jansson_set("string", "headers.Call-ID", "$ci", "$var(body)");
    jansson_set("string", "headers.User-Agent", "$hdr(User-Agent)", "$var(body)");
    if ($hdr(P-Asserted-Identity) != $null) {
        jansson_set("string", "headers.P-Asserted-Identity", "$hdr(P-Asserted-Identity)", "$var(body)");
    }
    if ($hdr(Identity) != $null) {
        jansson_set("string", "headers.Identity", "$hdr(Identity)", "$var(body)");
    }
    if ($hdr(X-BCID-Assertion) != $null) {
        jansson_set("string", "headers.X-BCID-Assertion", "$hdr(X-BCID-Assertion)", "$var(body)");
    }
    jansson_set("string", "headers.Contact", "$ct", "$var(body)");
    jansson_set("string", "headers.Via", "$hdr(Via)", "$var(body)");
    jansson_set("string", "headers.Max-Forwards", "$hdr(Max-Forwards)", "$var(body)");

    # http_connect() cannot add request headers, so the token would never
    # reach Falcon. http_client_query() takes a header block.
    $var(hdrs) = "Content-Type: application/json\r\nX-Falcon-Token: " + FALCON_TOKEN;
    $var(http) = http_client_query(FALCON_URL, "$var(body)", "$var(hdrs)", "$var(falcon)");
    if ($var(http) < 200 || $var(http) > 299) {
        xlog("L_WARN", "Falcon unreachable or refused ($var(http)), fail-open for $ci\n");
        return;
    }

    if (!jansson_get("action", $var(falcon), "$var(action)")) {
        return;
    }

    jansson_get("risk_score", $var(falcon), "$var(score)");
    append_hf("X-Falcon-Action: $var(action)\r\n");
    append_hf("X-Falcon-Score: $var(score)\r\n");
    if (jansson_get("bcid", $var(falcon), "$var(bcid)") && $var(bcid) != "") {
        append_hf("X-Falcon-BCID: $var(bcid)\r\n");
    }
    if (jansson_get("bcid_name", $var(falcon), "$var(bcidname)") && $var(bcidname) != "") {
        append_hf("X-Falcon-BCID-Name: $var(bcidname)\r\n");
        append_hf("Remote-Party-ID: \"$var(bcidname)\" <sip:$fU@$fd>;party=calling;screen=yes\r\n");
    }

    if ($var(action) == "reject" || $var(action) == "challenge") {
        jansson_get("sip_status", $var(falcon), "$var(code)");
        if ($var(code) == 0 || $var(code) == "") {
            $var(code) = 603;
        }
        send_reply("$var(code)", "Falcon");
        exit;
    }
}

