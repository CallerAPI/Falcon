# Falcon screen on INVITE, asynchronous. For a busy proxy.
#
# The synchronous falcon.cfg holds a worker for up to 2 s while Falcon
# answers. A Falcon that accepts connections and hangs would stall every
# worker. This file suspends the transaction instead and resumes it when
# the answer arrives, so workers keep serving other calls.
#
# Load tm.so, http_async_client.so, and jansson.so first, then import this
# file. Do not load those modules again here. Do not import falcon.cfg as
# well.
#
# Your request_route must:
#   1. call route(FALCON_SCREEN) for INVITE. Script execution stops there.
#   2. define route[FALCON_CONTINUE] with what you did after the screen.
#      It runs inside the resumed transaction, so reply with t_reply()
#      and relay with t_relay().
#
# Set the two defines before the import_file line, or edit them here.

#!ifndef FALCON_URL
#!define FALCON_URL "http://127.0.0.1:8090/v1/screen"
#!endif
#!ifndef FALCON_TOKEN
#!define FALCON_TOKEN ""
#!endif

# Milliseconds. Fail-open is the Falcon default. Keep it low.
modparam("http_async_client", "connection_timeout", 2000)
modparam("http_async_client", "workers", 2)

route[FALCON_SCREEN] {
    if (!is_method("INVITE")) {
        return;
    }

    $var(body) = "{}";
    jansson_set("string", "switch", "kamailio", "$var(body)");
    jansson_set("string", "method", "INVITE", "$var(body)");
    jansson_set("string", "request_uri", "$ru", "$var(body)");
    jansson_set("string", "source_ip", "$si", "$var(body)");
    jansson_set("object", "headers", "{}", "$var(body)");
    jansson_set("string", "headers.From", "$hdr(From)", "$var(body)");
    jansson_set("string", "headers.To", "$hdr(To)", "$var(body)");
    jansson_set("string", "headers.Call-ID", "$ci", "$var(body)");
    jansson_set("string", "headers.User-Agent", "$hdr(User-Agent)", "$var(body)");
    if ($hdr(P-Asserted-Identity) != $null) {
        jansson_set("string", "headers.P-Asserted-Identity", "$hdr(P-Asserted-Identity)", "$var(body)");
    }
    if ($hdr(Identity) != $null) {
        jansson_set("string", "headers.Identity", "$hdr(Identity)", "$var(body)");
    }
    jansson_set("string", "headers.Contact", "$ct", "$var(body)");
    jansson_set("string", "headers.Via", "$hdr(Via)", "$var(body)");
    jansson_set("string", "headers.Max-Forwards", "$hdr(Max-Forwards)", "$var(body)");

    # Create the transaction so it can be suspended and resumed.
    t_newtran();
    $http_req(all) = $null;
    $http_req(method) = "POST";
    $http_req(hdr) = "Content-Type: application/json";
    $http_req(hdr) = "X-Falcon-Token: " + FALCON_TOKEN;
    $http_req(body) = $var(body);
    $http_req(timeout) = 2000;
    if (http_async_query(FALCON_URL, "FALCON_RESUME") < 0) {
        xlog("L_WARN", "Falcon query could not start, fail-open for $ci\n");
        route(FALCON_CONTINUE);
    }
    exit;
}

route[FALCON_RESUME] {
    if ($http_ok != 1 || $http_rs < 200 || $http_rs > 299) {
        xlog("L_WARN", "Falcon unreachable or refused ($http_rs $http_err), fail-open for $ci\n");
        route(FALCON_CONTINUE);
        exit;
    }
    $var(falcon) = $http_rb;
    if (!jansson_get("action", $var(falcon), "$var(action)")) {
        route(FALCON_CONTINUE);
        exit;
    }

    jansson_get("risk_score", $var(falcon), "$var(score)");
    append_hf("X-Falcon-Action: $var(action)\r\n");
    append_hf("X-Falcon-Score: $var(score)\r\n");

    if ($var(action) == "reject" || $var(action) == "challenge") {
        jansson_get("sip_status", $var(falcon), "$var(code)");
        if ($var(code) == 0 || $var(code) == "") {
            $var(code) = 603;
        }
        t_reply("$var(code)", "Falcon");
        exit;
    }
    route(FALCON_CONTINUE);
    exit;
}
