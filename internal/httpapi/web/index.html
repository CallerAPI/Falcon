<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c11">
  <title>Falcon</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Pages">
      <a class="brand" href="#overview" aria-label="Falcon overview">
        <img src="/logo.png" alt="" width="30" height="30">
        <span><strong>Falcon</strong><small>by CallerAPI</small></span>
      </a>
      <ul class="nav" id="nav">
        <li><a href="#overview" data-view="overview">Overview</a></li>
        <li><a href="#calls" data-view="calls">Calls</a></li>
        <li><a href="#threats" data-view="threats">Threats</a></li>
        <li><a href="#rules" data-view="rules">Rules</a></li>
        <li><a href="#settings" data-view="settings">Settings</a></li>
      </ul>
      <div class="side-foot">
        <div class="health"><span class="dot" id="healthDot"></span><span id="healthText">Connecting</span></div>
        <div class="faint" id="versionText"></div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <div class="topbar-tools">
          <label class="search">
            <span class="sr-only">Search calls</span>
            <input id="search" type="search" placeholder="Search a number, IP, or Call-ID" autocomplete="off" spellcheck="false">
          </label>
          <div class="seg" id="rangeSeg" role="group" aria-label="Time range">
            <button type="button" data-range="1h">1h</button>
            <button type="button" data-range="24h">24h</button>
            <button type="button" data-range="7d">7d</button>
            <button type="button" data-range="30d">30d</button>
          </div>
          <button type="button" class="btn ghost" id="askBtn" hidden>Ask Falcon</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <aside id="drawer" class="drawer" hidden aria-label="Call detail" aria-modal="true" role="dialog">
    <header class="drawer-head">
      <div class="drawer-title">
        <div class="muted small" id="drawerKicker"></div>
        <h2 id="drawerTitle"></h2>
      </div>
      <button type="button" class="icon-btn" id="drawerClose" aria-label="Close">×</button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <aside id="ask" class="drawer ask" hidden aria-label="Ask Falcon" role="dialog">
    <header class="drawer-head">
      <div class="drawer-title"><div class="muted small" id="askProvider"></div><h2>Ask Falcon</h2></div>
      <button type="button" class="icon-btn" id="askClose" aria-label="Close">×</button>
    </header>
    <div class="ask-log" id="askLog"></div>
    <form class="ask-form" id="askForm">
      <input id="askInput" type="text" placeholder="What did Falcon stop today, and from whom?" autocomplete="off">
      <button class="btn primary" type="submit">Ask</button>
    </form>
  </aside>

  <div id="scrim" class="scrim" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
