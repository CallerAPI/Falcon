<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Falcon</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Sections">
      <a class="brand" href="#overview">
        <span class="mark" aria-hidden="true"><img src="/logo.png" alt=""></span>
        <span class="brand-text"><strong>Falcon</strong><small>by CallerAPI</small></span>
      </a>
      <ul class="nav" id="nav">
        <li><a href="#overview" data-view="overview"><i class="ico ico-grid"></i>Overview</a></li>
        <li><a href="#traffic" data-view="traffic"><i class="ico ico-list"></i>Traffic</a></li>
        <li><a href="#signers" data-view="signers"><i class="ico ico-shield"></i>Signers</a></li>
        <li><a href="#providers" data-view="providers"><i class="ico ico-globe"></i>Providers</a></li>
        <li><a href="#lists" data-view="lists"><i class="ico ico-rules"></i>Lists</a></li>
        <li><a href="#tuning" data-view="tuning"><i class="ico ico-tune"></i>Tuning</a></li>
        <li><a href="#system" data-view="system"><i class="ico ico-cog"></i>System</a></li>
        <li><a href="#plugins" data-view="plugins"><i class="ico ico-grid"></i>Plugins</a></li>
      </ul>
      <div class="side-foot">
        <div class="health"><span class="dot" id="healthDot"></span><span id="healthText">connecting</span></div>
        <div class="mono muted" id="installId">install —</div>
        <div class="mono muted" id="versionText"></div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="viewTitle">Overview</h1>
          <span class="muted" id="viewHint"></span>
        </div>
        <div class="topbar-right">
          <div class="search">
            <input id="search" type="search" placeholder="Search number, IP, Call-ID, signer  ( / )" autocomplete="off" spellcheck="false">
          </div>
          <div class="seg" id="rangeSeg" role="group" aria-label="Time range">
            <button data-range="15m">15m</button>
            <button data-range="1h">1h</button>
            <button data-range="6h">6h</button>
            <button data-range="24h" class="on">24h</button>
            <button data-range="7d">7d</button>
            <button data-range="30d">30d</button>
          </div>
          <button class="btn ghost" id="liveBtn" title="Live tail (L)"><span class="live-dot"></span>Live</button>
          <button class="btn primary" id="askBtn" title="Ask Falcon what it did and why (A)">Ask Falcon</button>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <aside id="drawer" class="drawer" hidden aria-label="Event detail">
    <header class="drawer-head">
      <div>
        <div class="muted small" id="drawerKicker">event</div>
        <h2 id="drawerTitle">—</h2>
      </div>
      <button class="btn ghost icon" id="drawerClose" title="Close (Esc)">✕</button>
    </header>
    <div class="tabs" id="drawerTabs">
      <button data-tab="summary" class="on">Summary</button>
      <button data-tab="shaken">PASSporT</button>
      <button data-tab="sip">SIP</button>
      <button data-tab="actions">Actions</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <aside id="ask" class="ask" hidden aria-label="Ask Falcon">
    <header class="ask-head">
      <div><div class="kicker">Ask Falcon</div><div class="muted small" id="askProvider"></div></div>
      <button class="btn ghost sm" id="askClose" aria-label="Close">✕</button>
    </header>
    <section class="ask-value" id="askValue"></section>
    <div class="ask-log" id="askLog"></div>
    <div class="ask-suggest" id="askSuggest"></div>
    <form class="ask-form" id="askForm">
      <input id="askInput" type="text" placeholder="What did Falcon block today, and from whom?" autocomplete="off">
      <button class="btn primary" type="submit">Ask</button>
    </form>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
